# Cloudflare Worker for room leaderboards and visitor counts. Setup: see server/README.md.
name = "type-defender"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Pages that may call the API (the game, plus local development).
ORIGINS = "https://timoschoenberger.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "type-defender"
database_id = "5d2211e4-9492-473e-ae2f-84d53c0c8e1c"

# Per-IP rate limits (requests per 60 seconds). A school class shares one IP, so these are generous.
[[ratelimits]]
name = "LIMIT_CREATE"
namespace_id = "1001"
simple = { limit = 4, period = 60 }

[[ratelimits]]
name = "LIMIT_WRITE"
namespace_id = "1002"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "LIMIT_HIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_READ"
namespace_id = "1004"
simple = { limit = 240, period = 60 }

# Daily cleanup of idle rooms and old visitor counts.
[triggers]
crons = ["17 3 * * *"]
